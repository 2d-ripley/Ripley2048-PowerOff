name: Build PaperS3 Factory Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "src/**"
      - "platformio.ini"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e PaperS3

      - name: Create merged factory.bin
        shell: bash
        run: |
          BUILD=".pio/build/PaperS3"
          ESPTOOL="$(find ~/.platformio/packages/tool-esptoolpy -type f -name esptool.py | head -1)"
          python "$ESPTOOL" --chip esp32s3 merge_bin \
            -o "$BUILD/Ripley2048_factory.bin" \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0000 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 "$BUILD/firmware.bin"

      - name: Prepare Web Installer payload
        shell: bash
        run: |
          mkdir -p web/firmware
          cp .pio/build/PaperS3/Ripley2048_factory.bin web/firmware/Ripley2048_factory.bin

      - name: Upload factory.bin
        uses: actions/upload-artifact@v4
        with:
          name: Ripley2048-PaperS3-factory
          path: |
            .pio/build/PaperS3/Ripley2048_factory.bin
            .pio/build/PaperS3/firmware.bin
            web/manifest.json
            web/index.html

      - name: Upload GitHub Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
