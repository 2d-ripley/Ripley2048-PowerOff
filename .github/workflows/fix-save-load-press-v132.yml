name: Fix v1.3.2 Save Load press

on:
  push:
    paths:
      - 'tools/fix_save_load_press_v132.py'
      - '.github/workflows/fix-save-load-press-v132.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply press-driven Save Load fix
        run: python3 tools/fix_save_load_press_v132.py

      - name: Commit patched firmware
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use press events for reliable Save Load buttons"
          git push
